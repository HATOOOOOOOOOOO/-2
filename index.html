<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

<title>ことば帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one full-screen stage on black. Portrait stacks the word over the details; landscape puts the word on the left and the details on the right. Controls float at the bottom and hide after a few seconds. */
:root {
  --bg: #000;
  --fg: #fff;
  --soft: #c9c9cf;
  --faint: #80808a;
  --line: #28282d;
  --edge: #3b3b42;
  --panel: #0c0c0f;
  --alert: #ff907f;
  --font-word: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --scale: 1;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
#app { position: relative; height: 100%; }

button {
  font: inherit;
  font-size: 0.92rem;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--edge);
  border-radius: 8px;
  min-height: 44px;
  padding: 0.35rem 0.6rem;
  cursor: pointer;
  touch-action: manipulation;
}
button:hover { background: #17171b; }
button:active { background: #232328; }
button:disabled { opacity: 0.35; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 2px;
}

/* ---------- stage ---------- */
.stage { position: absolute; inset: 0; display: flex; flex-direction: column; }
.wordpane {
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.5rem 0;
}
.word {
  --n: 2;
  font-family: var(--font-word);
  font-weight: 500;
  text-align: center;
  line-height: 1.2;
  letter-spacing: 0.02em;
  font-size: calc(min(86vw, 60vh) / var(--n));
  overflow-wrap: anywhere;
}
.detail {
  flex: 1;
  min-height: 0;
  min-width: 0;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 1.1rem 0 8.5rem;
  animation: rise 0.45s ease both;
}
.detail::-webkit-scrollbar { display: none; }
.stage[data-phase="word"] .detail,
.stage[data-phase="empty"] .detail,
.stage[data-phase="done"] .detail,
.stage[data-phase="empty"] .wordpane,
.stage[data-phase="done"] .wordpane { display: none; }
.stage[data-phase="full"] .wordpane {
  flex: 0 0 34%;
  border-bottom: 1px solid var(--line);
}
.stage[data-phase="full"] .word { font-size: calc(min(86vw, 30vh) / var(--n)); }

.reading { font-size: calc(1.6rem * var(--scale)); font-weight: 500; letter-spacing: 0.06em; }
.meaning {
  margin-top: 0.4rem;
  font-size: calc(1.1rem * var(--scale));
  color: var(--soft);
  white-space: pre-line;
}
.examples { list-style: none; margin: 1.1rem 0 0; padding: 0; }
.examples li {
  font-size: calc(1.2rem * var(--scale));
  line-height: 2.15;
  padding: 0.35rem 0;
  border-top: 1px solid var(--line);
}
.examples li:first-child { border-top: 0; }
ruby rt { font-size: 0.5em; color: var(--soft); letter-spacing: 0; }

.note { display: none; margin: auto; text-align: center; padding: 1rem 0 5rem; }
.stage[data-phase="empty"] .note,
.stage[data-phase="done"] .note { display: block; }
.note p { font-size: 1.15rem; margin: 0 0 1.2rem; color: var(--soft); }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (orientation: landscape) {
  .stage { flex-direction: row; }
  .word { font-size: calc(min(80vw, 120vh) / var(--n)); }
  .stage[data-phase="full"] .wordpane {
    flex: 0 0 40%;
    border-bottom: 0;
    border-right: 1px solid var(--line);
  }
  .stage[data-phase="full"] .word { font-size: calc(min(36vw, 70vh) / var(--n)); }
  /* Centre the details vertically, level with the word. The spacers collapse when the text is long, so it still scrolls. */
  .detail { display: flex; flex-direction: column; padding: 4.5rem 0 4.5rem 1.6rem; }
  .detail::before, .detail::after { content: ""; flex: 1 1 0; }
}

/* ---------- progress + status ---------- */
.progress {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;
  height: 2px;
  z-index: 30;
  pointer-events: none;
}
.progress i {
  display: block;
  height: 100%;
  background: rgba(255, 255, 255, 0.55);
  transform-origin: left center;
  transform: scaleX(0);
}
.progress[hidden] { display: none !important; }
.status {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: max(16px, env(safe-area-inset-left, 0px));
  z-index: 30;
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  color: var(--faint);
  pointer-events: none;
}

/* ---------- controls ---------- */
.controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 2.2rem max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, #000 62%, rgba(0, 0, 0, 0));
  visibility: hidden;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.25s, transform 0.25s, visibility 0s 0.25s;
}
.ui .controls { visibility: visible; opacity: 1; transform: none; transition-delay: 0s; }
@media (orientation: landscape) {
  .controls { grid-template-columns: repeat(6, 1fr); padding-top: 1.4rem; }
}

.fsbtn {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: max(16px, env(safe-area-inset-right, 0px));
  z-index: 30;
  min-height: 38px;
  font-size: 0.82rem;
  padding: 0.2rem 0.8rem;
  background: rgba(0, 0, 0, 0.65);
  visibility: hidden;
  opacity: 0;
  transition: opacity 0.25s, visibility 0s 0.25s;
}
.ui .fsbtn { visibility: visible; opacity: 1; transition-delay: 0s; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(8.5rem + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  max-width: min(92vw, 30rem);
  padding: 0.55rem 0.9rem;
  background: #1b1b20;
  border: 1px solid var(--edge);
  border-radius: 8px;
  font-size: 0.9rem;
}
.toast button { min-height: 36px; white-space: nowrap; }
@media (orientation: landscape) { .toast { bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px)); } }

/* ---------- sheet (settings) ---------- */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--bg);
  overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
}
.sh-inner { max-width: 40rem; margin: 0 auto; }
.sh-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: grid;
  grid-template-columns: 5.5rem 1fr 5.5rem;
  align-items: center;
  gap: 0.5rem;
  padding: calc(env(safe-area-inset-top, 0px) + 0.6rem) 0 0.6rem;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.sh-head h1 { margin: 0; font-size: 1.05rem; text-align: center; font-weight: 700; }
.sh-head button { min-height: 40px; }
.sh-body { padding-top: 0.5rem; }
.blk { padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
.blk:last-child { border-bottom: 0; }
.blk h2 { margin: 0 0 0.7rem; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.14em; color: var(--faint); }
.stat { margin: 0 0 0.5rem; font-size: 1.05rem; }
.hint { margin: 0 0 0.8rem; color: var(--soft); font-size: 0.9rem; }
.btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 8px; }
.rowset {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.45rem 0;
  min-width: 0;
}
.rowset label { flex: 1; min-width: 0; }
select, input[type="text"], input[type="search"], textarea {
  font: inherit;
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 8px;
  padding: 0.5rem 0.6rem;
  min-height: 44px;
  box-sizing: border-box;
  max-width: 100%;
}
textarea { width: 100%; min-height: 0; line-height: 1.6; resize: vertical; }
input[type="text"], input[type="search"] { width: 100%; }
input[type="file"] { color: var(--soft); max-width: 100%; }
input[type="checkbox"] { width: 1.3rem; height: 1.3rem; accent-color: #fff; }
.field { display: grid; gap: 0.3rem; margin-bottom: 0.9rem; }
.field > label { font-size: 0.85rem; color: var(--soft); }
.field small { color: var(--faint); font-size: 0.8rem; }

.cardrow {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.6rem;
  align-items: center;
  padding: 0.7rem 0;
  border-bottom: 1px solid var(--line);
}
.cardrow .cw { min-width: 0; }
.cardrow .cw b { font-family: var(--font-word); font-size: 1.2rem; font-weight: 500; margin-right: 0.6rem; }
.cardrow .cw span { color: var(--soft); font-size: 0.9rem; }
.cardrow .cw div { color: var(--faint); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cardrow.off .cw { opacity: 0.45; }
.cardrow .acts { display: flex; gap: 6px; }
.cardrow .acts button { min-height: 38px; font-size: 0.82rem; padding: 0.2rem 0.55rem; }
.tag { display: inline-block; border: 1px solid var(--edge); border-radius: 6px; font-size: 0.72rem; padding: 0 0.4rem; margin-left: 0.4rem; color: var(--soft); }

.scroller { overflow-x: auto; margin: 0.5rem 0 1rem; border: 1px solid var(--line); border-radius: 8px; }
.scroller table { border-collapse: collapse; font-size: 0.82rem; width: max-content; min-width: 100%; }
.scroller th, .scroller td { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; }
.scroller th { color: var(--faint); font-weight: 500; }
.danger { color: var(--alert); border-color: #5a2d27; }
.msg { margin: 0.7rem 0; color: var(--soft); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>

<body>
<div id="app">
  <main id="stage" class="stage" data-phase="word">
    <section class="wordpane"><div id="word" class="word"></div></section>
    <section id="detail" class="detail">
      <div id="reading" class="reading"></div>
      <div id="meaning" class="meaning"></div>
      <ul id="examples" class="examples"></ul>
    </section>
    <div id="note" class="note"><p id="note-text"></p><button id="note-btn" type="button"></button></div>
  </main>
  <div id="progress" class="progress"><i id="prog-fill"></i></div>
  <div id="status" class="status"></div>
  <nav id="controls" class="controls" aria-label="操作">
    <button id="b-pause" type="button">一時停止</button>
    <button id="b-next" type="button">次へ</button>
    <button id="b-know" type="button">覚えた</button>
    <button id="b-prev" type="button">戻る</button>
    <button id="b-mid" type="button">答えを見る</button>
    <button id="b-set" type="button">設定</button>
  </nav>
  <button id="b-fs" class="fsbtn" type="button" hidden>全画面</button>
  <div id="toast" class="toast" hidden></div>
  <div id="sheet" class="sheet" hidden></div>
</div>

<script>
// <pure>
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function fmtSec(s) {
  if (s < 60) return s + '秒';
  if (s >= 3600) return (s / 3600) + '時間';
  var m = Math.floor(s / 60), r = s % 60;
  return r ? m + '分' + r + '秒' : m + '分';
}

var KANJI_RE = /[㐀-鿿豈-﫿々〆ヶ]/;
function hasKanji(s) { return KANJI_RE.test(String(s || '')); }

// Anki style furigana: 漢字[かんじ]  (a space before the kanji marks the boundary)
function parseFurigana(raw) {
  var s = String(raw || '').replace(/\[sound:[^\]]*\]/g, '');
  var re = /([㐀-鿿豈-﫿々〆ヶ]+)\[([^\[\]]+)\]/g;
  var out = [], last = 0, m;
  while ((m = re.exec(s))) {
    var pre = s.slice(last, m.index);
    if (pre.slice(-1) === ' ') pre = pre.slice(0, -1);
    if (pre) out.push({ t: pre });
    out.push({ t: m[1], r: m[2] });
    last = m.index + m[0].length;
  }
  var rest = s.slice(last);
  if (rest) out.push({ t: rest });
  return out;
}
function plain(raw) { return parseFurigana(raw).map(function (t) { return t.t; }).join(''); }

function decodeEntities(s) {
  return s
    .replace(/&nbsp;/gi, ' ').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#0*39;/g, "'")
    .replace(/&#(\d+);/g, function (m, n) { return String.fromCodePoint(+n); })
    .replace(/&#x([0-9a-f]+);/gi, function (m, n) { return String.fromCodePoint(parseInt(n, 16)); })
    .replace(/&amp;/gi, '&');
}
function cleanField(s) {
  s = String(s == null ? '' : s);
  s = s.replace(/<rp>[^<]*<\/rp>/gi, '');
  s = s.replace(/<ruby[^>]*>([\s\S]*?)<rt[^>]*>([\s\S]*?)<\/rt>\s*<\/ruby>/gi, function (m, a, b) {
    return a.replace(/<[^>]*>/g, '') + '[' + b.replace(/<[^>]*>/g, '') + ']';
  });
  s = s.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|li)>/gi, '\n');
  s = s.replace(/<[^>]*>/g, '');
  s = decodeEntities(s).replace(/\[sound:[^\]]*\]/g, '').replace(/\r/g, '');
  return s.split('\n').map(function (l) { return l.trim(); }).join('\n').replace(/\n{2,}/g, '\n').trim();
}

function parseDelimited(text) {
  text = String(text || '').replace(/^﻿/, '');
  var lines = text.split(/\r?\n/), i = 0, sep = null;
  var names = { tab: '\t', comma: ',', semicolon: ';', space: ' ', pipe: '|', colon: ':' };
  while (i < lines.length && lines[i].charAt(0) === '#') {
    var m = /^#separator:(.*)$/.exec(lines[i]);
    if (m) { var k = m[1].trim(); sep = names[k] || (k.length === 1 ? k : null); }
    i++;
  }
  var body = lines.slice(i).join('\n');
  if (!sep) {
    var first = lines.slice(i).find(function (l) { return l.trim(); }) || '';
    var tabs = (first.match(/\t/g) || []).length;
    var commas = (first.match(/,/g) || []).length;
    var semis = (first.match(/;/g) || []).length;
    sep = tabs ? '\t' : (semis > commas ? ';' : ',');
  }
  var rows = [], row = [], field = '', inQ = false;
  for (var p = 0; p < body.length; p++) {
    var c = body[p];
    if (inQ) {
      if (c === '"') { if (body[p + 1] === '"') { field += '"'; p++; } else inQ = false; }
      else field += c;
    } else if (c === '"' && field === '') {
      inQ = true;
    } else if (c === sep) {
      row.push(field); field = '';
    } else if (c === '\n') {
      row.push(field); rows.push(row); row = []; field = '';
    } else if (c !== '\r') {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (f) { return String(f).trim() !== ''; }); });
}

function guessMapping(rows) {
  var sample = rows.slice(0, 30), n = Math.max.apply(null, [0].concat(sample.map(function (r) { return r.length; })));
  var kanaRe = /^[぀-ヿー\s・、。]+$/, jpRe = /[぀-ヿ㐀-鿿]/;
  var cols = [];
  for (var i = 0; i < n; i++) {
    var vals = sample.map(function (r) { return cleanField(r[i] || ''); }).filter(Boolean);
    var k = vals.length || 1;
    var avg = vals.reduce(function (a, v) { return a + Array.from(v).length; }, 0) / k;
    var frac = function (fn) { return vals.filter(fn).length / k; };
    cols.push({
      i: i, filled: vals.length / (sample.length || 1), avg: avg,
      kana: frac(function (v) { return kanaRe.test(plain(v) || v); }),
      jp: frac(function (v) { return jpRe.test(v); }),
      sent: frac(function (v) { return /[。！？]/.test(v); }),
      idlike: frac(function (v) { return /^\S{8,14}$/.test(v) && !jpRe.test(v); })
    });
  }
  var used = {}, map = { w: -1, r: -1, m: -1, e: [] };
  cols.forEach(function (c) {
    if (c.sent >= 0.3 && c.avg >= 8 && map.e.length < 3) { map.e.push(c.i); used[c.i] = 1; }
  });
  var pick = function (test) {
    for (var q = 0; q < cols.length; q++) { if (!used[cols[q].i] && test(cols[q])) { used[cols[q].i] = 1; return cols[q].i; } }
    return -1;
  };
  map.w = pick(function (c) { return c.filled > 0.5 && c.jp >= 0.7 && c.avg <= 16; });
  map.r = pick(function (c) { return c.filled > 0.3 && c.kana >= 0.7 && c.avg <= 24; });
  map.m = pick(function (c) { return c.filled > 0.5 && c.idlike < 0.8; });
  if (map.w < 0) map.w = 0;
  return map;
}

function buildCards(rows, map, skipHead) {
  var out = [];
  var g = function (r, i) { return i >= 0 ? cleanField(r[i] || '') : ''; };
  rows.slice(skipHead ? 1 : 0).forEach(function (r) {
    var w = g(r, map.w);
    if (!w) return;
    var e = [];
    (map.e || []).forEach(function (i) {
      g(r, i).split('\n').forEach(function (l) { l = l.trim(); if (l) e.push(l); });
    });
    out.push({ w: w.replace(/\n+/g, ' '), r: g(r, map.r).replace(/\n+/g, ' '), m: g(r, map.m), e: e });
  });
  return out;
}

function cardKey(c) { return plain(c.w) + '|' + plain(c.r || ''); }
function mergeCards(existing, incoming, mode, mkId) {
  var base = mode === 'replace' ? [] : existing.filter(function (c) { return !c.s; });
  var idx = new Map(base.map(function (c) { return [cardKey(c), c]; }));
  var added = 0, updated = 0;
  incoming.forEach(function (n) {
    var k = cardKey(n), ex = idx.get(k);
    if (ex) {
      ex.w = n.w;
      if (n.m) ex.m = n.m;
      if (n.e.length) ex.e = n.e;
      updated++;
    } else {
      var c = { id: mkId(), w: n.w, r: n.r, m: n.m, e: n.e, h: 0, t: 0, n: 0 };
      base.push(c); idx.set(k, c); added++;
    }
  });
  return { cards: base, added: added, updated: updated };
}

function pickNext(cards, st, now, excludeId, ignoreCd) {
  var cdMs = (ignoreCd ? 0 : st.cd) * 864e5;
  var ok = function (c) { return !c.h && (!cdMs || !c.t || now - c.t >= cdMs); };
  var pool = cards.filter(function (c) { return c.id !== excludeId && ok(c); });
  if (!pool.length) {
    var live = cards.filter(function (c) { return !c.h; });
    if (live.length === 1 && live[0].id === excludeId && ok(live[0])) return live[0];
    return null;
  }
  if (st.ord === 'rnd') return pool[Math.floor(Math.random() * pool.length)];
  var best = pool[0];
  pool.forEach(function (c) { if ((c.t || 0) < (best.t || 0)) best = c; });
  return best;
}
// </pure>
</script>

<script>
(function () {
  'use strict';

  /* ---------- storage ---------- */

  var settings = Object.assign({}, DEFAULTS, load(LS_SET) || {});
  var SCALES = [0.85, 1, 1.2, 1.45];

  function sampleCards() {
    var S = [
      ['経験', 'けいけん', '実際にやってみて、身につけた知識や技術。', ['海外[かいがい]で 働[はたら]いた 経験[けいけん]があります。', 'いい 経験[けいけん]になりました。']],
      ['準備', 'じゅんび', 'あとで困らないように、前もって用意しておくこと。', ['旅行[りょこう]の 準備[じゅんび]をします。', '準備[じゅんび]はできましたか。']],
      ['約束', 'やくそく', '人と前もって決めておくこと。', ['友達[ともだち]と 約束[やくそく]があります。', '約束[やくそく]を 守[まも]ってください。']],
      ['続ける', 'つづける', 'やめないで、そのまま行う。', ['毎日[まいにち] 日本語[にほんご]の 勉強[べんきょう]を 続[つづ]けています。', '雨[あめ]が 降[ふ]っても、走[はし]り 続[つづ]けた。']],
      ['景色', 'けしき', '目に見える自然や町のようす。', ['山[やま]の 景色[けしき]がとてもきれいです。']],
      ['慣れる', 'なれる', '何度も経験して、普通に感じるようになる。', ['日本[にほん]の 生活[せいかつ]にだいぶ 慣[な]れました。', '早起[はやお]きに 慣[な]れるまで 時間[じかん]がかかった。']],
      ['都合', 'つごう', '物事を進めるための事情や、時間の空き具合。', ['来週[らいしゅう]の 都合[つごう]はどうですか。', '都合[つごう]が 悪[わる]くなりました。']],
      ['相談', 'そうだん', '問題について、人と話して考えること。', ['先生[せんせい]に 相談[そうだん]してみます。', '友達[ともだち]に 相談[そうだん]したら、気[き]が 楽[らく]になった。']]
    ];
    return S.map(function (s) { return { id: newId(), w: s[0], r: s[1], m: s[2], e: s[3], h: 0, t: 0, n: 0, s: 1 }; });
  }
  var cards = load(LS_CARDS);
  if (!Array.isArray(cards)) cards = sampleCards();

  var saveT;
  function saveCards() { clearTimeout(saveT); saveT = setTimeout(function () { save(LS_CARDS, cards); }, 400); }
  function flush() { clearTimeout(saveT); save(LS_CARDS, cards); }
  function saveSettings() { save(LS_SET, settings); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });
  window.addEventListener('pagehide', flush);

  /* ---------- state ---------- */
  var state = { cur: null, phase: 'word', elapsed: 0, paused: false, hist: [], sheetOpen: false, last: performance.now(), ignoreCd: false };
  var stage = $('#stage'), app = $('#app');
  var elWord = $('#word'), elReading = $('#reading'), elMeaning = $('#meaning'), elEx = $('#examples');
  var elProg = $('#progress'), elFill = $('#prog-fill'), elStatus = $('#status');
  var bPause = $('#b-pause'), bNext = $('#b-next'), bKnow = $('#b-know'), bPrev = $('#b-prev'), bMid = $('#b-mid'), bSet = $('#b-set');

  function readingOf(c) {
    var r = c.r ? plain(cleanField(c.r)) : '';
    if (!r) {
      var toks = parseFurigana(c.w);
      if (toks.some(function (t) { return t.r; })) r = toks.map(function (t) { return t.r || t.t; }).join('');
    }
    return r === plain(c.w) ? '' : r;
  }
  function rubyInto(parent, raw) {
    parseFurigana(raw).forEach(function (t) {
      if (t.r) parent.append(h('ruby', null, t.t, h('rt', { text: t.r })));
      else parent.append(document.createTextNode(t.t));
    });
  }

  function renderCard() {
    stage.dataset.phase = state.phase;
    var c = state.cur;
    if (!c) { renderNote(); updateControls(); return; }
    var w = plain(c.w);
    elWord.textContent = w;
    elWord.style.setProperty('--n', Math.max(2, Array.from(w).length));
    var r = readingOf(c);
    elReading.textContent = r;
    elReading.hidden = !r;
    elMeaning.textContent = c.m || '';
    elMeaning.hidden = !c.m;
    elEx.replaceChildren();
    (c.e || []).forEach(function (line) { var li = h('li'); rubyInto(li, line); elEx.append(li); });
    elEx.hidden = !(c.e && c.e.length);
    updateControls();
  }
  function renderNote() {
    var empty = state.phase === 'empty';
    $('#note-text').textContent = empty ? '表示できる単語がありません。' : 'いま表示できる単語は、すべて表示しました。';
    var b = $('#note-btn');
    b.textContent = empty ? '設定を開く' : 'もう一度はじめから';
    b.onclick = empty ? function () { openSheet('main'); } : function () { state.ignoreCd = true; pickAndShow(null); };
  }
  function updateControls() {
    var live = !!state.cur;
    bPause.textContent = state.paused ? '再開' : '一時停止';
    bNext.disabled = !live; bKnow.disabled = !live; bMid.disabled = !live;
    bPrev.disabled = state.hist.length === 0;
    bMid.textContent = state.phase === 'word' ? '答えを見る' : '読み上げ';
    elStatus.textContent = state.paused ? '一時停止中' : '';
  }

  function show(card) {
    state.cur = card; state.phase = 'word'; state.elapsed = 0; state.last = performance.now();
    renderCard(); setProgress(0);
  }
  function pickAndShow(excludeId) {
    var nxt = pickNext(cards, settings, Date.now(), excludeId, state.ignoreCd);
    if (nxt) { show(nxt); return; }
    state.cur = null;
    state.phase = cards.some(function (c) { return !c.h; }) ? 'done' : 'empty';
    state.elapsed = 0; renderCard(); setProgress(0);
  }
  function advance() {
    var prev = state.cur;
    if (prev) {
      prev.t = Date.now(); prev.n = (prev.n || 0) + 1;
      state.hist.push(prev.id); if (state.hist.length > 30) state.hist.shift();
      saveCards();
    }
    pickAndShow(prev && prev.id);
  }
  function goBack() {
    while (state.hist.length) {
      var id = state.hist.pop();
      var c = cards.find(function (x) { return x.id === id; });
      if (c && !c.h) { show(c); return; }
    }
    toast('これ以上は戻れません。');
    updateControls();
  }
  function reveal() {
    if (!state.cur || state.phase !== 'word') return;
    state.phase = 'full'; state.elapsed = 0;
    renderCard(); setProgress(0);
    if (settings.tts) speak(readingOf(state.cur) || plain(state.cur.w));
  }
  function know() {
    var c = state.cur; if (!c) return;
    c.h = 1;
    advance();
    toast('「' + plain(c.w) + '」はもう表示しません。', '取り消す', function () {
      c.h = 0; saveCards();
      state.hist = state.hist.filter(function (id) { return id !== c.id; });
      show(c);
    });
  }

  function setProgress(p) { elFill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, p)) + ')'; }

    var now = performance.now(), dt = now - state.last; state.last = now;
    if (state.paused || state.sheetOpen || document.hidden || !state.cur) return;

    setProgress(state.elapsed / dur);

  }, 250);

  /* ---------- speech ---------- */
  function speak() {
    try {
      var ss = window.speechSynthesis; if (!ss) return;

      Array.prototype.slice.call(arguments).filter(Boolean).forEach(function (text) {
        var u = new SpeechSynthesisUtterance(text);

      });
    } catch (e) { /* ignore */ }
  }
  function readAloud() {
    var c = state.cur; if (!c) return;
    var first = (c.e && c.e[0]) ? plain(c.e[0]) : '';
    speak(readingOf(c) || plain(c.w), first);
  }

  /* ---------- controls visibility ---------- */
  var uiT;
  function showUI() {
    app.classList.add('ui'); clearTimeout(uiT);
    if (!state.paused) uiT = setTimeout(hideUI, 5000);
  }
  function hideUI() { if (!state.paused) app.classList.remove('ui'); }
  stage.addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    if (app.classList.contains('ui') && !state.paused) { clearTimeout(uiT); hideUI(); } else showUI();
  });
  function bind(btn, fn) { btn.addEventListener('click', function () { fn(); showUI(); }); }
  bind(bPause, function () { state.paused = !state.paused; state.last = performance.now(); updateControls(); });
  bind(bNext, function () { if (state.cur) advance(); });
  bind(bPrev, goBack);
  bind(bKnow, know);
  bind(bMid, function () { if (state.phase === 'word') reveal(); else readAloud(); });
  bind(bSet, function () { openSheet('main'); });
  document.addEventListener('keydown', function (e) {

  /* ---------- fullscreen ---------- */

  var fsOk = !!(rootEl.requestFullscreen || rootEl.webkitRequestFullscreen);
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }

    elToast.hidden = false;
    toastT = setTimeout(function () { elToast.hidden = true; }, actionLabel ? 7000 : 3500);
  }

  /* ---------- wake lock ---------- */

  document.addEventListener('pointerdown', wake, { once: true });

  function applySettings() {
    document.documentElement.style.setProperty('--scale', SCALES[settings.sc] || 1);
    elProg.hidden = !settings.bar;
    if (settings.wake) wake(); else unwake();
  }

  /* ---------- sheet (settings) ---------- */
  var sheetEl = $('#sheet'), stack = [];
  var TITLES = { main: '設定', list: '単語の一覧', edit: '単語', import: 'Ankiから取り込む', backup: 'バックアップ' };
  function openSheet(name) { state.sheetOpen = true; stack = [{ name: name }]; sheetEl.hidden = false; drawSheet(); sheetEl.scrollTop = 0; }
  function push(name, arg) { stack.push({ name: name, arg: arg }); drawSheet(); sheetEl.scrollTop = 0; }
  function pop() { stack.pop(); if (!stack.length) closeSheet(); else drawSheet(); }
  function closeSheet() {

    if (c && (cards.indexOf(c) < 0 || c.h)) { state.cur = null; pickAndShow(null); }

  }
  function drawSheet() {
    var top = stack[stack.length - 1];
    var body = ({ main: viewMain, list: viewList, edit: viewEdit, import: viewImport, backup: viewBackup })[top.name](top.arg);
    sheetEl.replaceChildren(h('div', { class: 'sh-inner' },
      h('header', { class: 'sh-head' },
        stack.length > 1 ? h('button', { type: 'button', text: '戻る', onclick: pop }) : h('span'),
        h('h1', { text: TITLES[top.name] }),
        h('button', { type: 'button', text: '閉じる', onclick: closeSheet })),
      body));
  }
  function btn(label, fn, cls) { return h('button', { type: 'button', text: label, class: cls, onclick: fn }); }
  function selRow(label, id, opts, value, onchange) {
    var sel = h('select', { id: id }, opts.map(function (o) { return h('option', { value: String(o[0]), text: o[1] }); }));
    sel.value = String(value);
    sel.addEventListener('change', function () { onchange(sel.value); saveSettings(); applySettings(); });
    return h('div', { class: 'rowset' }, h('label', { for: id, text: label }), sel);
  }

      b.dataset.arm = '1'; b.textContent = confirmLabel;
      t = setTimeout(function () { delete b.dataset.arm; b.textContent = label; }, 4000);
    });
    return b;
  }

  function viewMain() {
    var total = cards.length, hid = cards.filter(function (c) { return c.h; }).length;
    var hasSample = cards.some(function (c) { return c.s; });
    var secs = [5, 10, 15, 20, 30, 45, 60, 90].map(function (v) { return [v, fmtSec(v)]; });
    var longs = [15, 20, 30, 45, 60, 90, 120, 180, 300, 600, 900, 1800, 3600].map(function (v) { return [v, fmtSec(v)]; });
    var days = [[0, 'なし'], [1, '1日'], [2, '2日'], [3, '3日'], [7, '7日'], [14, '14日'], [30, '30日']];
    return h('div', { class: 'sh-body' },
      h('section', { class: 'blk' }, h('h2', { text: '単語帳' }),
        h('p', { class: 'stat', text: '全部で' + total + '語（非表示 ' + hid + '語）' }),
        hasSample && h('p', { class: 'hint', text: 'いまはサンプルの単語です。取り込むと自動で消えます。' }),
        h('div', { class: 'btns' },
          btn('一覧を見る', function () { push('list'); }),
          btn('単語を追加', function () { push('edit', null); }),
          btn('Ankiから取り込む', function () { push('import'); }),
          btn('バックアップ', function () { push('backup'); }),
          hasSample && btn('サンプルを消す', function () { cards = cards.filter(function (c) { return !c.s; }); saveCards(); drawSheet(); }))),
      h('section', { class: 'blk' }, h('h2', { text: '表示' }),
        selRow('単語だけを見せる時間', 's-t1', secs, settings.t1, function (v) { settings.t1 = +v; }),
        selRow('全部を見せる時間', 's-t2', longs, settings.t2, function (v) { settings.t2 = +v; }),
        selRow('同じ単語を出す間隔', 's-cd', days, settings.cd, function (v) { settings.cd = +v; state.ignoreCd = false; }),
        selRow('出す順番', 's-ord', [['seq', '順番に'], ['rnd', 'ランダム']], settings.ord, function (v) { settings.ord = v; }),
        selRow('文字の大きさ', 's-sc', [[0, '小'], [1, '中'], [2, '大'], [3, '特大']], settings.sc, function (v) { settings.sc = +v; }),
        selRow('自動で読み上げる', 's-tts', [[0, 'オフ'], [1, 'オン']], settings.tts, function (v) { settings.tts = +v; }),
        selRow('進行バー', 's-bar', [[1, 'オン'], [0, 'オフ']], settings.bar, function (v) { settings.bar = +v; }),
        selRow('画面を消さない', 's-wake', [[1, 'オン'], [0, 'オフ']], settings.wake, function (v) { settings.wake = +v; })),
      h('section', { class: 'blk' }, h('h2', { text: '画面' }),
        fsOk
          ? btn('全画面にする', function () { closeSheet(); toggleFs(); })
          : h('p', { class: 'hint', text: 'このブラウザでは全画面ボタンを使えません。共有メニューから「ホーム画面に追加」すると、全画面で使えます。' })));
  }

  function viewList() {
    var q = h('input', { type: 'search', id: 'list-q', placeholder: 'さがす', 'aria-label': 'さがす' });
    var box = h('div'), limit = 50;
    function draw() {
      var term = q.value.trim().toLowerCase();
      var items = cards.filter(function (c) {
        return !term || (plain(c.w) + ' ' + (c.r || '') + ' ' + (c.m || '')).toLowerCase().indexOf(term) >= 0;
      });
      box.replaceChildren();
      if (!items.length) box.append(h('p', { class: 'msg', text: '該当する単語がありません。' }));
      items.slice(0, limit).forEach(function (c) {
        box.append(h('div', { class: 'cardrow' + (c.h ? ' off' : '') },
          h('div', { class: 'cw' },
            h('div', null, h('b', { text: plain(c.w) }), h('span', { text: readingOf(c) }),
              c.h && h('span', { class: 'tag', text: '非表示' }), c.s && h('span', { class: 'tag', text: 'サンプル' })),
            h('div', { text: c.m || '' })),
          h('div', { class: 'acts' },
            btn('編集', function () { push('edit', c.id); }),
            btn(c.h ? '表示する' : '隠す', function () { c.h = c.h ? 0 : 1; saveCards(); draw(); }))));
      });
      if (items.length > limit) box.append(btn('もっと見る（残り' + (items.length - limit) + '語）', function () { limit += 100; draw(); }));
    }

  }

  function viewEdit(id) {

    var fw = h('input', { type: 'text', id: 'f-w', value: c ? c.w : '', autocomplete: 'off' });
    var fr = h('input', { type: 'text', id: 'f-r', value: c ? (c.r || '') : '', autocomplete: 'off' });
    var fm = h('textarea', { id: 'f-m', rows: '2', value: c ? (c.m || '') : '' });
    var fe = h('textarea', { id: 'f-e', rows: '6', value: c ? (c.e || []).join('\n') : '' });
    var msg = h('p', { class: 'msg' });

    return h('div', { class: 'sh-body' }, h('div', { class: 'blk' },
      field('単語', fw),
      field('読み（ふりがな）', fr),
      field('意味', fm),
      field('例文', fe, '1行に1文。ふりがなは「漢字[かんじ]」のように書きます。'),
      msg,
      h('div', { class: 'btns' },
        btn('保存', function () {
          var w = fw.value.trim();

          var e = fe.value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
          if (c) { c.w = w; c.r = fr.value.trim(); c.m = fm.value.trim(); c.e = e; c.s = 0; }
          else cards.push({ id: newId(), w: w, r: fr.value.trim(), m: fm.value.trim(), e: e, h: 0, t: 0, n: 0 });
          if (!c) cards = cards.filter(function (x) { return !x.s; });
          saveCards(); pop();
        }),
        c && twoStep('削除', '本当に削除する', function () {
          cards = cards.filter(function (x) { return x !== c; }); saveCards(); pop();
        }, 'danger'))));
  }

  function viewImport() {
    var out = h('div');
    var file = h('input', { type: 'file', id: 'imp-file', accept: '.txt,.csv,.tsv,text/plain,text/csv,text/tab-separated-values', 'aria-label': 'ファイルを選ぶ' });
    var area = h('textarea', { id: 'imp-text', rows: '4', placeholder: 'ここに貼り付けることもできます' });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { area.value = ''; proceed(String(fr.result)); };
      fr.onerror = function () { out.replaceChildren(h('p', { class: 'msg', text: 'ファイルを読み込めませんでした。' })); };
      fr.readAsText(f, 'utf-8');
    });
    function proceed(text) {
      var rows = parseDelimited(text);
      if (!rows.length) { out.replaceChildren(h('p', { class: 'msg', text: '読み込める行がありません。' })); return; }
      var n = Math.max.apply(null, rows.map(function (r) { return r.length; }));
      var map = (settings.map && settings.map.n === n) ? settings.map : Object.assign(guessMapping(rows), { n: n });
      var sels = {};
      function colSel(key, label, val, optional) {
        var opts = optional ? [h('option', { value: '-1', text: 'なし' })] : [];
        for (var i = 0; i < n; i++) opts.push(h('option', { value: String(i), text: '列' + (i + 1) + '：' + Array.from(cleanField(rows[0][i] || '')).slice(0, 14).join('') }));
        var s = h('select', { id: 'm-' + key }, opts); s.value = String(val); sels[key] = s;
        return h('div', { class: 'rowset' }, h('label', { for: 'm-' + key, text: label }), s);
      }
      var head = h('input', { type: 'checkbox', id: 'imp-head' });
      var mode = h('select', { id: 'imp-mode' }, h('option', { value: 'add', text: '追加・更新する' }), h('option', { value: 'replace', text: 'すべて置き換える' }));
      var result = h('p', { class: 'msg' });
      var table = h('table', null,
        h('thead', null, h('tr', null, Array.from({ length: n }, function (_, i) { return h('th', { text: '列' + (i + 1) }); }))),
        h('tbody', null, rows.slice(0, 3).map(function (r) {
          return h('tr', null, Array.from({ length: n }, function (_, i) { return h('td', { text: cleanField(r[i] || '').replace(/\n/g, ' ') }); }));
        })));
      out.replaceChildren(
        h('p', { class: 'stat', text: rows.length + '行を読み込みました。' }),
        h('div', { class: 'scroller' }, table),
        colSel('w', '単語', map.w, false),
        colSel('r', '読み', map.r, true),
        colSel('m', '意味', map.m, true),
        colSel('e0', '例文 1', map.e[0] != null ? map.e[0] : -1, true),
        colSel('e1', '例文 2', map.e[1] != null ? map.e[1] : -1, true),
        colSel('e2', '例文 3', map.e[2] != null ? map.e[2] : -1, true),
        h('div', { class: 'rowset' }, h('label', { for: 'imp-head', text: '1行目は見出し' }), head),
        h('div', { class: 'rowset' }, h('label', { for: 'imp-mode', text: '取り込み方' }), mode),
        result,
        btn('取り込む', function () {
          var m = { w: +sels.w.value, r: +sels.r.value, m: +sels.m.value, n: n,
            e: ['e0', 'e1', 'e2'].map(function (k) { return +sels[k].value; }).filter(function (v) { return v >= 0; }) };
          var incoming = buildCards(rows, m, head.checked);
          if (!incoming.length) { result.textContent = '取り込める単語がありませんでした。列の選び方を確認してください。'; return; }
          var r = mergeCards(cards, incoming, mode.value, newId);
          cards = r.cards; settings.map = m; saveSettings(); flush();
          state.ignoreCd = false;
          result.textContent = r.added + '語を追加、' + r.updated + '語を更新しました。（合計 ' + cards.length + '語）';
        }));
    }
    return h('div', { class: 'sh-body' }, h('div', { class: 'blk' },
      h('p', { class: 'hint', text: 'Ankiで「ファイル → 書き出し」から、形式を「ノート（テキスト）」にして書き出したファイルを選んでください。' }),
      h('div', { class: 'field' }, file),
      h('div', { class: 'field' }, area, btn('貼り付けた内容を読み込む', function () { proceed(area.value); }))),
      h('div', { class: 'blk' }, out));
  }

  function viewBackup() {
    var out = h('textarea', { id: 'bk-out', rows: '5', readonly: true, 'aria-label': '書き出した内容' });
    var inp = h('textarea', { id: 'bk-in', rows: '5', placeholder: '書き出した内容をここに貼り付けます' });
    var msg = h('p', { class: 'msg' });
    return h('div', { class: 'sh-body' },
      h('div', { class: 'blk' }, h('h2', { text: '書き出し' }),
        h('p', { class: 'hint', text: '内容をコピーして、メモなどに保存しておくと安全です。' }),
        out,
        h('div', { class: 'btns', style: 'margin-top:.6rem' },
          btn('書き出す', function () { out.value = JSON.stringify({ v: 1, cards: cards, settings: settings }); msg.textContent = '書き出しました。'; }),
          btn('コピー', function () {
            if (!out.value) out.value = JSON.stringify({ v: 1, cards: cards, settings: settings });
            var fallback = function () { out.focus(); out.select(); msg.textContent = '選択しました。コピーしてください。'; };
            try { navigator.clipboard.writeText(out.value).then(function () { msg.textContent = 'コピーしました。'; }, fallback); } catch (e) { fallback(); }
          }))),
      h('div', { class: 'blk' }, h('h2', { text: '復元' }), inp,
        h('div', { class: 'btns', style: 'margin-top:.6rem' },
          twoStep('復元する', '今の単語帳を置き換える', function () {
            try {
              var d = JSON.parse(inp.value);
              if (!d || !Array.isArray(d.cards)) throw new Error('bad');
              cards = d.cards.filter(function (c) { return c && c.w; }).map(function (c) {
                return { id: c.id || newId(), w: String(c.w), r: c.r || '', m: c.m || '', e: Array.isArray(c.e) ? c.e : [], h: c.h ? 1 : 0, t: c.t || 0, n: c.n || 0 };
              });
              if (d.settings) settings = Object.assign({}, DEFAULTS, d.settings);
              flush(); saveSettings(); applySettings();
              msg.textContent = cards.length + '語を復元しました。';
            } catch (e) { msg.textContent = '内容を読み取れませんでした。'; }
          }))),
      h('div', { class: 'blk' }, h('h2', { text: '削除' }),
        twoStep('すべての単語を削除', '本当に削除する', function () { cards = []; flush(); msg.textContent = 'すべて削除しました。'; }, 'danger'),
        msg));
  }

  /* ---------- boot ---------- */
  applySettings();
  pickAndShow(null);
  showUI();
})();
</script>
</body>
</html>
